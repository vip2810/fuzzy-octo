<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-jothipala" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#704214"/>
    </radialGradient>
    <linearGradient id="shine-j" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8DC" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow-j">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="url(#bg-jothipala)"/>

  <!-- Decorative circle -->
  <circle cx="200" cy="180" r="120" fill="none" stroke="#FFF8DC" stroke-width="1.5" stroke-opacity="0.25"/>
  <circle cx="200" cy="180" r="140" fill="none" stroke="#FFF8DC" stroke-width="0.8" stroke-opacity="0.15"/>

  <!-- Microphone body -->
  <g filter="url(#glow-j)" opacity="0.9">
    <!-- Mic head (mesh ball) -->
    <circle cx="200" cy="120" r="45" fill="#1A1A1A" stroke="#FFD700" stroke-width="2"/>
    <circle cx="200" cy="120" r="40" fill="none" stroke="#B8860B" stroke-width="0.8" stroke-dasharray="4,3"/>
    <circle cx="200" cy="120" r="32" fill="none" stroke="#B8860B" stroke-width="0.6" stroke-dasharray="3,4"/>
    <circle cx="200" cy="120" r="24" fill="none" stroke="#B8860B" stroke-width="0.5" stroke-dasharray="2,4"/>
    <!-- Mic highlight -->
    <ellipse cx="188" cy="108" rx="15" ry="20" fill="#FFD700" opacity="0.15"/>

    <!-- Mic handle -->
    <rect x="192" y="163" width="16" height="80" rx="4" fill="#2A2A2A" stroke="#B8860B" stroke-width="1.5"/>
    <!-- Handle ring -->
    <rect x="189" y="168" width="22" height="6" rx="3" fill="#FFD700" opacity="0.7"/>
    <!-- Handle base -->
    <ellipse cx="200" cy="248" rx="14" ry="6" fill="#1A1A1A" stroke="#B8860B" stroke-width="1"/>
  </g>

  <!-- Musical notes - left -->
  <g fill="#FFF8DC" opacity="0.6">
    <!-- Note 1 -->
    <ellipse cx="105" cy="155" rx="10" ry="7" transform="rotate(-20,105,155)"/>
    <rect x="114" y="110" width="3" height="45"/>
    <path d="M117,110 Q130,105 125,120 Q120,130 117,125" fill="#FFF8DC"/>

    <!-- Note 2 -->
    <ellipse cx="290" cy="140" rx="9" ry="6.5" transform="rotate(-15,290,140)"/>
    <rect x="298" y="98" width="2.5" height="42"/>
    <path d="M300.5,98 Q312,93 308,106 Q304,115 300.5,110" fill="#FFF8DC"/>

    <!-- Small notes scattered -->
    <ellipse cx="130" cy="220" rx="6" ry="4" transform="rotate(-25,130,220)" opacity="0.4"/>
    <rect x="135" y="195" width="2" height="25" opacity="0.4"/>

    <ellipse cx="275" cy="210" rx="6" ry="4" transform="rotate(15,275,210)" opacity="0.4"/>
    <rect x="280" y="185" width="2" height="25" opacity="0.4"/>
  </g>

  <!-- Sparkle dots -->
  <circle cx="145" cy="100" r="2" fill="#FFF8DC" opacity="0.5"/>
  <circle cx="260" cy="90" r="1.5" fill="#FFF8DC" opacity="0.4"/>
  <circle cx="310" cy="180" r="2" fill="#FFF8DC" opacity="0.3"/>
  <circle cx="90" cy="190" r="1.5" fill="#FFF8DC" opacity="0.35"/>

  <!-- Sound wave arcs -->
  <path d="M145,120 Q140,95 145,70" fill="none" stroke="#FFF8DC" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M135,120 Q128,85 135,50" fill="none" stroke="#FFF8DC" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>
  <path d="M255,120 Q260,95 255,70" fill="none" stroke="#FFF8DC" stroke-width="1.5" stroke-opacity="0.3" stroke-linecap="round"/>
  <path d="M265,120 Q272,85 265,50" fill="none" stroke="#FFF8DC" stroke-width="1" stroke-opacity="0.2" stroke-linecap="round"/>

  <!-- Divider line -->
  <line x1="120" y1="320" x2="280" y2="320" stroke="#FFF8DC" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Initials -->
  <text x="200" y="365" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#FFF8DC" letter-spacing="8" opacity="0.85">HRJ</text>
</svg>