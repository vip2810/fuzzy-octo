<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bg-clarence" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="55%" stop-color="#6A0DAD"/>
      <stop offset="100%" stop-color="#2E0854"/>
    </radialGradient>
    <linearGradient id="guitar-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D5F5"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </linearGradient>
    <filter id="glow-c">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="20" fill="url(#bg-clarence)"/>

  <!-- Decorative rings -->
  <circle cx="200" cy="190" r="135" fill="none" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.1"/>
  <circle cx="200" cy="190" r="155" fill="none" stroke="#E8D5F5" stroke-width="0.6" stroke-opacity="0.07"/>

  <!-- Guitar silhouette -->
  <g filter="url(#glow-c)" transform="translate(200,180)">
    <!-- Guitar neck -->
    <rect x="-8" y="-130" width="16" height="90" rx="3" fill="#1A0A2A" stroke="#9B59B6" stroke-width="2"/>
    <!-- Frets -->
    <line x1="-6" y1="-110" x2="6" y2="-110" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="-6" y1="-95" x2="6" y2="-95" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="-6" y1="-80" x2="6" y2="-80" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="-6" y1="-65" x2="6" y2="-65" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="-6" y1="-50" x2="6" y2="-50" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.4"/>
    <!-- Fret dots -->
    <circle cx="0" cy="-102" r="2" fill="#E8D5F5" opacity="0.3"/>
    <circle cx="0" cy="-72" r="2" fill="#E8D5F5" opacity="0.3"/>

    <!-- Headstock -->
    <path d="M-12,-130 L-12,-148 Q-12,-158 -4,-158 L4,-158 Q12,-158 12,-148 L12,-130"
          fill="#1A0A2A" stroke="#9B59B6" stroke-width="2"/>
    <!-- Tuning pegs -->
    <circle cx="-16" cy="-150" r="3.5" fill="#2A1A3A" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="-16" cy="-138" r="3.5" fill="#2A1A3A" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="-150" r="3.5" fill="#2A1A3A" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="-138" r="3.5" fill="#2A1A3A" stroke="#E8D5F5" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Guitar body - upper bout -->
    <ellipse cx="0" cy="-20" rx="38" ry="28" fill="#1A0A2A" stroke="#9B59B6" stroke-width="2.5"/>
    <!-- Guitar body - lower bout -->
    <ellipse cx="0" cy="40" rx="52" ry="42" fill="#1A0A2A" stroke="#9B59B6" stroke-width="2.5"/>
    <!-- Waist connector -->
    <path d="M-38,-20 Q-28,10 -52,40" fill="none" stroke="#9B59B6" stroke-width="2.5"/>
    <path d="M38,-20 Q28,10 52,40" fill="none" stroke="#9B59B6" stroke-width="2.5"/>
    <!-- Fill the body interior -->
    <path d="M-38,-20 Q-28,10 -52,40 A52,42 0 0,0 52,40 Q28,10 38,-20 A38,28 0 0,0 -38,-20Z"
          fill="#1A0A2A"/>

    <!-- Sound hole -->
    <circle cx="0" cy="30" r="18" fill="#0D0520" stroke="#9B59B6" stroke-width="1.5"/>
    <circle cx="0" cy="30" r="14" fill="none" stroke="#E8D5F5" stroke-width="0.5" stroke-opacity="0.3"/>

    <!-- Bridge -->
    <rect x="-20" y="58" width="40" height="4" rx="2" fill="#2A1A3A" stroke="#E8D5F5" stroke-width="0.5" stroke-opacity="0.4"/>

    <!-- Strings -->
    <line x1="-4" y1="-130" x2="-6" y2="58" stroke="#E8D5F5" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="0" y1="-130" x2="0" y2="58" stroke="#E8D5F5" stroke-width="0.5" stroke-opacity="0.3"/>
    <line x1="4" y1="-130" x2="6" y2="58" stroke="#E8D5F5" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- Decorative sparkles -->
  <circle cx="100" cy="100" r="2" fill="#E8D5F5" opacity="0.4"/>
  <circle cx="310" cy="120" r="1.5" fill="#E8D5F5" opacity="0.35"/>
  <circle cx="90" cy="250" r="1.5" fill="#E8D5F5" opacity="0.3"/>
  <circle cx="320" cy="270" r="2" fill="#E8D5F5" opacity="0.25"/>
  <circle cx="140" cy="310" r="1.5" fill="#9B59B6" opacity="0.3"/>
  <circle cx="270" cy="300" r="1.8" fill="#9B59B6" opacity="0.25"/>

  <!-- Small musical notes -->
  <g fill="#E8D5F5" opacity="0.3">
    <ellipse cx="85" cy="170" rx="6" ry="4" transform="rotate(-20,85,170)"/>
    <rect x="90" y="148" width="2" height="22"/>
    <ellipse cx="320" cy="200" rx="6" ry="4" transform="rotate(15,320,200)"/>
    <rect x="325" y="178" width="2" height="22"/>
  </g>

  <!-- Divider -->
  <line x1="120" y1="330" x2="280" y2="330" stroke="#E8D5F5" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Initials -->
  <text x="200" y="373" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#E8D5F5" letter-spacing="8" opacity="0.85">CW</text>
</svg>